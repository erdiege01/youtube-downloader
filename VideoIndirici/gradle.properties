org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Proje yolu "Varsayılan Proje" gibi ASCII olmayan karakterler içeriyor.
# Derleme çıktıları zaten yerel diske (C:/tools/videindirici-build)
# yönlendirildiği ve tüm kaynak dosya adları ASCII olduğundan bu kontrol
# atlanabilir.
android.overridePathCheck=true
